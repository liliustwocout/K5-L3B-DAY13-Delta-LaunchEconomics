# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm -> cần 42 nhân viên mỗi nhóm, tổng 84 người > 40: không đủ nhân sự
#   c) 20 nhân viên mỗi nhóm: giới hạn hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt cho mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: tối đa c / ICC = 6 / 0,02 = 300: quá ít cụm, không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) * 0,02) >= 859 -> m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng xử lý song song trong cùng tuần và cùng depot
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo từng depot
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ kinh nghiệm xử lý; giảm bằng cấp quyền theo staff_id và log lượt mở trợ lý
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã viết trước và chốt cứng trong pilot plan trước ngày bắt đầu
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (20 cụm) ở mỗi nhóm
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận kiểm định mức chênh 6 điểm (thay vì 5 điểm) để giữ đơn vị chia theo nhân viên (20 cụm/nhóm, tránh tràn tác động). Nếu mức chênh thực tế chỉ là 5 điểm, statistical power giảm từ 0,80 xuống còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ hiện tại: 4,25% toàn bộ dữ liệu (3,97% trong phạm vi noi_dia + hang_nang). Ngưỡng an toàn: chênh lệch >= 2 điểm phần trăm so với nhóm đối chứng hoặc trần tuyệt đối 6,0%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 -> 10 -> 20 nhân viên; đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm song song cùng tuần, cùng depot và nhận cùng luồng yêu cầu hoàn phí"
    spillover_risk: "Nhân viên cùng depot trao đổi giải pháp; hạn chế bằng phân quyền theo staff_id và log mọi lượt mở trợ lý"
    predeclared: "Chỉ số chính, mde 0.06, baseline 0.70, luật dừng và ngày quyết định chốt trước ngày pilot bắt đầu"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trên dashboard admin, có hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm theo quy trình chuẩn"
  decision_date: "2027-01-05"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated"]
